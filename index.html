<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fading Writer - 外部提示版</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f8fafc;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 700px;
            align-items: center;
            margin-bottom: 30px;
        }
        .progress {
            font-size: 1.1rem;
            font-weight: bold;
            color: #64748b;
            background: white;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* 游戏主体容器 */
        .game-area {
            width: 100%;
            max-width: 700px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .hint-section {
            text-align: center;
            margin-bottom: 40px;
        }
        .hint-en {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e53e3e;
            margin-bottom: 5px;
        }
        .hint-py {
            font-size: 1.2rem;
            color: #718096;
            letter-spacing: 2px;
        }

        /* 整体展示区布局 */
        .word-display {
            display: flex;
            gap: 30px; /* 两个字组之间的间距 */
            margin-bottom: 20px;
            justify-content: center;
        }

        /* 单个汉字组合（包含外部提示 + 米字格） */
        .char-group {
            display: flex;
            align-items: center;
            gap: 15px; /* 外部提示和米字格的间距 */
        }

        /* 外部蓝色部件提示 */
        .side-hint {
            font-family: "Kaiti SC", "Kaiti", "STKaiti", "楷体", serif;
            font-size: 3.5rem;
            color: #3b82f6;
            opacity: 0;
            transition: opacity 0.3s ease;
            width: 70px;
            text-align: center;
            user-select: none;
        }
        .side-hint.show {
            opacity: 1;
        }

        /* 米字格 SVG 背景绘制 */
        .mizige {
            width: 160px;
            height: 160px;
            border: 2px solid #ef4444;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><line x1='0' y1='80' x2='160' y2='80' stroke='%23ef4444' stroke-width='1.5' stroke-dasharray='6,4'/><line x1='80' y1='0' x2='80' y2='160' stroke='%23ef4444' stroke-width='1.5' stroke-dasharray='6,4'/><line x1='0' y1='0' x2='160' y2='160' stroke='%23ef4444' stroke-width='1' stroke-dasharray='3,4'/><line x1='160' y1='0' x2='0' y2='160' stroke='%23ef4444' stroke-width='1' stroke-dasharray='3,4'/></svg>");
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: white;
            flex-shrink: 0;
        }

        /* 黑色保留部件（通过 clip-path 裁剪掉不需要的部分） */
        .layer-given {
            position: absolute;
            font-family: "Kaiti SC", "Kaiti", "STKaiti", "楷体", serif;
            font-size: 130px;
            line-height: 160px;
            text-align: center;
            width: 100%;
            height: 100%;
            user-select: none;
            top: 0;
            left: 0;
            color: #1e293b;
            z-index: 2;
            transition: clip-path 0.4s ease;
        }
        /* 点击 Show Full Word 时，取消裁剪，展示全黑汉字 */
        .layer-given.show-full {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%) !important;
        }

        /* 底部操作按钮 */
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-nav { background-color: #64748b; color: white; }
        .btn-nav:hover { background-color: #475569; }
        .btn-nav:disabled { background-color: #cbd5e0; cursor: not-allowed; box-shadow: none; }
        
        .btn-action { background-color: #3b82f6; color: white; }
        .btn-action:hover { background-color: #2563eb; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-success:hover { background-color: #059669; }
    </style>
</head>
<body>

    <h1>📝 Fading Writer</h1>

    <div class="header-controls">
        <div class="progress" id="progress-text">Word 1 / 4</div>
    </div>

    <!-- 游戏展示区 -->
    <div class="game-area">
        <div class="hint-section">
            <div class="hint-en" id="hint-en">sign up</div>
            <div class="hint-py" id="hint-py">(bào míng)</div>
        </div>

        <div class="word-display" id="word-display">
            <!-- JS 动态生成 -->
        </div>
    </div>

    <!-- 按钮控制区 -->
    <div class="controls">
        <button class="btn btn-nav" id="prev-btn" onclick="changeWord(-1)">⬅️ Prev</button>
        <button class="btn btn-action" id="toggle-parts-btn" onclick="toggleMissingParts()">🔍 Reveal Parts</button>
        <button class="btn btn-success" id="toggle-word-btn" onclick="toggleFullWord()">✨ Show Full Word</button>
        <button class="btn btn-nav" id="next-btn" onclick="changeWord(1)">Next ➡️</button>
    </div>

    <script>
        // 数据结构：新增 missing 字段用于外部提示。clip 依然控制黑色部件的精确留存位置。
        const vocabData = [
            {
                word: "报名", pinyin: "bào míng", english: "sign up",
                chars: [
                    { text: "报", clip: "polygon(0 0, 42% 0, 42% 100%, 0 100%)", missing: "卩又" },
                    { text: "名", clip: "polygon(0 0, 100% 0, 100% 52%, 0 52%)", missing: "口" }
                ]
            },
            {
                word: "体验", pinyin: "tǐ yàn", english: "experience",
                chars: [
                    { text: "体", clip: "polygon(0 0, 35% 0, 35% 100%, 0 100%)", missing: "本" },
                    { text: "验", clip: "polygon(0 0, 43% 0, 43% 100%, 0 100%)", missing: "佥" }
                ]
            },
            {
                word: "乘坐", pinyin: "chéng zuò", english: "take (a ride)",
                chars: [
                    { text: "乘", clip: "polygon(0 0, 100% 0, 100% 45%, 0 45%)", missing: "北" },
                    { text: "坐", clip: "polygon(0 0, 100% 0, 100% 60%, 0 60%)", missing: "土" }
                ]
            },
            {
                word: "全球", pinyin: "quán qiú", english: "global",
                chars: [
                    { text: "全", clip: "polygon(0 0, 100% 0, 100% 50%, 0 50%)", missing: "王" },
                    { text: "球", clip: "polygon(0 0, 38% 0, 38% 100%, 0 100%)", missing: "求" }
                ]
            }
        ];

        let currentIndex = 0;
        let isPartsRevealed = false;
        let isWordRevealed = false;

        function renderWord() {
            const currentItem = vocabData[currentIndex];
            
            // 重置状态
            isPartsRevealed = false;
            isWordRevealed = false;
            document.getElementById('toggle-parts-btn').innerText = "🔍 Reveal Parts";
            document.getElementById('toggle-word-btn').innerText = "✨ Show Full Word";
            
            // 渲染提示
            document.getElementById('hint-en').innerText = currentItem.english;
            document.getElementById('hint-py').innerText = currentItem.pinyin;
            
            // 渲染展示区
            const displayArea = document.getElementById('word-display');
            displayArea.innerHTML = '';
            
            currentItem.chars.forEach((charObj, index) => {
                // 创建包裹提示与格子的容器
                const group = document.createElement('div');
                group.className = 'char-group';

                // 创建米字格
                const mizige = document.createElement('div');
                mizige.className = 'mizige';
                
                // 表层：黑色给定部件
                const layerGiven = document.createElement('div');
                layerGiven.className = 'char-layer layer-given';
                layerGiven.innerText = charObj.text;
                layerGiven.style.clipPath = charObj.clip;
                
                mizige.appendChild(layerGiven);

                // 创建外部蓝色提示部件
                const hint = document.createElement('div');
                hint.className = 'side-hint';
                hint.innerText = charObj.missing;

                // 左边汉字的提示放在米字格左边，右边汉字的提示放在米字格右边
                if (index === 0) {
                    group.appendChild(hint);
                    group.appendChild(mizige);
                } else {
                    group.appendChild(mizige);
                    group.appendChild(hint);
                }

                displayArea.appendChild(group);
            });

            // 更新进度
            document.getElementById('progress-text').innerText = `Word ${currentIndex + 1} / ${vocabData.length}`;
            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            document.getElementById('next-btn').disabled = (currentIndex === vocabData.length - 1);
        }

        // 切换揭晓/隐藏外部提示部件
        function toggleMissingParts() {
            isPartsRevealed = !isPartsRevealed;
            const hints = document.querySelectorAll('.side-hint');
            const btn = document.getElementById('toggle-parts-btn');
            
            hints.forEach(hint => {
                if (isPartsRevealed) {
                    hint.classList.add('show');
                } else {
                    hint.classList.remove('show');
                }
            });

            btn.innerText = isPartsRevealed ? "🙈 Hide Parts" : "🔍 Reveal Parts";
            
            // 互斥逻辑：揭晓提示时，自动关闭全字显示
            if (isPartsRevealed && isWordRevealed) {
                toggleFullWord(); 
            }
        }

        // 切换揭晓/隐藏完整汉字
        function toggleFullWord() {
            isWordRevealed = !isWordRevealed;
            const givenLayers = document.querySelectorAll('.layer-given');
            const btn = document.getElementById('toggle-word-btn');
            
            givenLayers.forEach(layer => {
                if (isWordRevealed) {
                    layer.classList.add('show-full');
                } else {
                    layer.classList.remove('show-full');
                }
            });

            btn.innerText = isWordRevealed ? "🙈 Hide Full Word" : "✨ Show Full Word";
            
            // 互斥逻辑：展示全字时，自动关闭外部提示
            if (isWordRevealed && isPartsRevealed) {
                toggleMissingParts();
            }
        }

        function changeWord(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= vocabData.length) currentIndex = vocabData.length - 1;
            renderWord();
        }

        window.onload = renderWord;
    </script>

</body>
</html>
