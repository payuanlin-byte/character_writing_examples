<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fading Writer - 田字格版</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f8fafc;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 700px;
            align-items: center;
            margin-bottom: 30px;
        }
        .progress {
            font-size: 1.1rem;
            font-weight: bold;
            color: #64748b;
            background: white;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* 游戏主体容器 */
        .game-area {
            width: 100%;
            max-width: 700px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .hint-section {
            text-align: center;
            margin-bottom: 40px;
        }
        .hint-en {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e53e3e;
            margin-bottom: 5px;
        }
        .hint-py {
            font-size: 1.2rem;
            color: #718096;
            letter-spacing: 2px;
        }

        /* 田字格展示区 */
        .word-display {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
        }

        /* 核心：田字格 CSS 绘制 */
        .tianzige {
            width: 140px;
            height: 140px;
            border: 3px solid #ef4444; /* 红色外框 */
            position: relative;
            background-color: transparent;
            box-sizing: border-box;
        }
        
        .tianzige::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            border-top: 2px dashed #ef4444; /* 红色虚线横线 */
            transform: translateY(-50%);
        }
        
        .tianzige::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            border-left: 2px dashed #ef4444; /* 红色虚线竖线 */
            transform: translateX(-50%);
        }

        .tianzige-content {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: grid;
            z-index: 1; /* 确保文字在虚线之上 */
        }

        /* 左右与上下结构的网络划分 */
        .layout-lr { grid-template-columns: 1fr 1fr; }
        .layout-tb { grid-template-rows: 1fr 1fr; }

        .part-box {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Kaiti SC", "Kaiti", "STKaiti", "楷体", serif;
            font-size: 3.5rem; /* 根据半格大小调整 */
            width: 100%;
            height: 100%;
        }

        .part-given {
            color: #1e293b; /* 给定的部件颜色较深 */
        }

        .part-missing {
            color: transparent; /* 默认隐藏 */
            transition: color 0.2s ease;
        }

        /* 揭晓状态 */
        .part-missing.revealed {
            color: #3b82f6; /* 揭晓后显示蓝色，方便区分 */
        }

        /* 完整汉字展示 */
        .full-word-display {
            font-family: "Kaiti SC", "Kaiti", "STKaiti", "楷体", serif;
            font-size: 3.5rem;
            color: #10b981;
            letter-spacing: 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            margin-top: 10px;
            height: 60px;
        }
        .full-word-display.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 底部操作按钮 */
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-nav {
            background-color: #64748b;
            color: white;
        }
        .btn-nav:hover { background-color: #475569; }
        .btn-nav:disabled { background-color: #cbd5e0; cursor: not-allowed; box-shadow: none; }
        
        .btn-action {
            background-color: #3b82f6;
            color: white;
        }
        .btn-action:hover { background-color: #2563eb; }
        .btn-success {
            background-color: #10b981;
            color: white;
        }
        .btn-success:hover { background-color: #059669; }
    </style>
</head>
<body>

    <h1>📝 Fading Writer</h1>

    <div class="header-controls">
        <div class="progress" id="progress-text">Word 1 / 4</div>
    </div>

    <!-- 游戏展示区 -->
    <div class="game-area">
        <div class="hint-section">
            <div class="hint-en" id="hint-en">sign up</div>
            <div class="hint-py" id="hint-py">(bào míng)</div>
        </div>

        <div class="word-display" id="word-display">
            <!-- JS 动态生成带有田字格的汉字结构 -->
        </div>

        <div class="full-word-display" id="full-word-display"></div>
    </div>

    <!-- 按钮控制区 -->
    <div class="controls">
        <button class="btn btn-nav" id="prev-btn" onclick="changeWord(-1)">⬅️ Prev</button>
        <button class="btn btn-action" id="toggle-parts-btn" onclick="toggleMissingParts()">🔍 Reveal Parts</button>
        <button class="btn btn-success" id="toggle-word-btn" onclick="toggleFullWord()">✨ Show Full Word</button>
        <button class="btn btn-nav" id="next-btn" onclick="changeWord(1)">Next ➡️</button>
    </div>

    <script>
        // 数据结构：p1 是第一个位置（左或上），p2 是第二个位置（右或下）
        const vocabData = [
            {
                word: "报名", pinyin: "bào míng", english: "sign up",
                chars: [
                    { full: "报", layout: "lr", p1: {text: "扌", type: "given"}, p2: {text: "卩又", type: "missing"} },
                    { full: "名", layout: "tb", p1: {text: "夕", type: "given"}, p2: {text: "口", type: "missing"} }
                ]
            },
            {
                word: "体验", pinyin: "tǐ yàn", english: "experience",
                chars: [
                    { full: "体", layout: "lr", p1: {text: "亻", type: "given"}, p2: {text: "本", type: "missing"} },
                    { full: "验", layout: "lr", p1: {text: "马", type: "given"}, p2: {text: "佥", type: "missing"} }
                ]
            },
            {
                word: "乘坐", pinyin: "chéng zuò", english: "take (a ride)",
                chars: [
                    { full: "乘", layout: "tb", p1: {text: "禾", type: "given"}, p2: {text: "北", type: "missing"} }, 
                    { full: "坐", layout: "tb", p1: {text: "从", type: "given"}, p2: {text: "土", type: "missing"} }
                ]
            },
            {
                word: "全球", pinyin: "quán qiú", english: "global",
                chars: [
                    { full: "全", layout: "tb", p1: {text: "人", type: "given"}, p2: {text: "王", type: "missing"} },
                    { full: "球", layout: "lr", p1: {text: "王", type: "given"}, p2: {text: "求", type: "missing"} }
                ]
            }
        ];

        let currentIndex = 0;
        let isPartsRevealed = false;
        let isWordRevealed = false;

        function renderWord() {
            const currentItem = vocabData[currentIndex];
            
            // 重置状态变量和按钮文本
            isPartsRevealed = false;
            isWordRevealed = false;
            document.getElementById('toggle-parts-btn').innerText = "🔍 Reveal Parts";
            document.getElementById('toggle-word-btn').innerText = "✨ Show Full Word";
            
            // 渲染提示
            document.getElementById('hint-en').innerText = currentItem.english;
            document.getElementById('hint-py').innerText = currentItem.pinyin;
            
            // 渲染结构格
            const displayArea = document.getElementById('word-display');
            displayArea.innerHTML = '';
            
            currentItem.chars.forEach(charObj => {
                const tianzige = document.createElement('div');
                tianzige.className = 'tianzige';
                
                const contentGrid = document.createElement('div');
                contentGrid.className = `tianzige-content layout-${charObj.layout}`;
                
                // 处理 P1 (左或上)
                const p1Div = document.createElement('div');
                p1Div.className = `part-box part-${charObj.p1.type}`;
                p1Div.innerText = charObj.p1.text;
                
                // 处理 P2 (右或下)
                const p2Div = document.createElement('div');
                p2Div.className = `part-box part-${charObj.p2.type}`;
                p2Div.innerText = charObj.p2.text;
                
                contentGrid.appendChild(p1Div);
                contentGrid.appendChild(p2Div);
                tianzige.appendChild(contentGrid);
                displayArea.appendChild(tianzige);
            });

            // 隐藏完整答案
            const fullWordEl = document.getElementById('full-word-display');
            fullWordEl.innerText = currentItem.word;
            fullWordEl.classList.remove('show');

            // 更新导航按钮状态
            document.getElementById('progress-text').innerText = `Word ${currentIndex + 1} / ${vocabData.length}`;
            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            document.getElementById('next-btn').disabled = (currentIndex === vocabData.length - 1);
        }

        // 切换揭晓/隐藏部件
        function toggleMissingParts() {
            isPartsRevealed = !isPartsRevealed;
            const missingParts = document.querySelectorAll('.part-missing');
            const btn = document.getElementById('toggle-parts-btn');
            
            missingParts.forEach(part => {
                if (isPartsRevealed) {
                    part.classList.add('revealed');
                } else {
                    part.classList.remove('revealed');
                }
            });

            btn.innerText = isPartsRevealed ? "🙈 Hide Parts" : "🔍 Reveal Parts";
        }

        // 切换揭晓/隐藏完整汉字
        function toggleFullWord() {
            isWordRevealed = !isWordRevealed;
            const fullWordEl = document.getElementById('full-word-display');
            const btn = document.getElementById('toggle-word-btn');
            
            if (isWordRevealed) {
                fullWordEl.classList.add('show');
                btn.innerText = "🙈 Hide Full Word";
            } else {
                fullWordEl.classList.remove('show');
                btn.innerText = "✨ Show Full Word";
            }
        }

        // 切换词汇
        function changeWord(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= vocabData.length) currentIndex = vocabData.length - 1;
            renderWord();
        }

        // 页面初始化
        window.onload = renderWord;
    </script>

</body>
</html>
