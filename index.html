<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanzi Builder</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 700px;
            align-items: center;
            margin-bottom: 30px;
        }
        .progress {
            font-size: 1.1rem;
            font-weight: bold;
            color: #555;
            background: white;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        /* 游戏主体容器 */
        .game-area {
            position: relative;
            width: 100%;
            max-width: 700px;
            min-height: 250px;
            background: white;
            border: 2px dashed #cbd5e0;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            overflow: hidden;
        }

        /* 散落的部件样式 */
        .components-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
        }
        .component-card {
            background: #e3f2fd;
            color: #1976d2;
            font-size: 2.5rem;
            font-family: "Kaiti SC", "Kaiti", serif;
            font-weight: bold;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(25, 118, 210, 0.15);
            border: 2px solid #bbdefb;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }
        
        /* 组合后的答案样式 */
        .answer-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
            pointer-events: none;
        }
        .answer-word {
            font-size: 5rem;
            font-family: "Kaiti SC", "Kaiti", serif;
            color: #2c3e50;
            letter-spacing: 10px;
            margin-bottom: 10px;
        }
        .answer-hint {
            font-size: 1.5rem;
            color: #e53e3e;
            font-weight: bold;
            background: #fed7d7;
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* 动画激活状态 */
        .game-area.combined .components-container {
            transform: scale(0);
            opacity: 0;
        }
        .game-area.combined .answer-container {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* 底部操作按钮 */
        .controls {
            display: flex;
            gap: 20px;
        }
        .btn {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-nav {
            background-color: #718096;
            color: white;
        }
        .btn-nav:hover { background-color: #4a5568; }
        .btn-nav:disabled { background-color: #cbd5e0; cursor: not-allowed; box-shadow: none; }
        
        .btn-combine {
            background-color: #48bb78;
            color: white;
            font-size: 1.2rem;
            padding: 12px 40px;
        }
        .btn-combine:hover { background-color: #38a169; }
    </style>
</head>
<body>

    <h1>🧩 Hanzi Builder</h1>

    <div class="header-controls">
        <div class="progress" id="progress-text">Word 1 / 45</div>
    </div>

    <!-- 游戏展示区 -->
    <div class="game-area" id="game-area">
        <!-- 散落部件 -->
        <div class="components-container" id="components-display"></div>
        
        <!-- 组合答案 -->
        <div class="answer-container">
            <div class="answer-word" id="answer-word"></div>
            <div class="answer-hint" id="answer-hint"></div>
        </div>
    </div>

    <!-- 按钮控制区 -->
    <div class="controls">
        <button class="btn btn-nav" id="prev-btn" onclick="changeWord(-1)">⬅️ Prev</button>
        <button class="btn btn-combine" id="combine-btn" onclick="combineComponents()">🧩 Combine</button>
        <button class="btn btn-nav" id="next-btn" onclick="changeWord(1)">Next ➡️</button>
    </div>

    <script>
        // 45个词汇及其精细拆解部件库
        const vocabData = [
            { word: '费用', components: ['弗', '贝', '用'], hint: 'cost' },
            { word: '价格', components: ['亻', '介', '木', '各'], hint: 'price' },
            { word: '软件', components: ['车', '欠', '亻', '牛'], hint: 'software' },
            { word: '需求', components: ['雨', '而', '求'], hint: 'demand' },
            { word: '优化', components: ['亻', '尤', '亻', '匕'], hint: 'optimize' },
            { word: '线路', components: ['纟', '泉', '足', '各'], hint: 'route' },
            { word: '节约', components: ['艹', '卩', '纟', '勺'], hint: 'save' },
            { word: '乘车', components: ['禾', '北', '车'], hint: 'ride' },
            { word: '省钱', components: ['少', '目', '钅', '戋'], hint: 'save money' },
            { word: '节省', components: ['艹', '卩', '少', '目'], hint: 'save' },
            { word: '欢迎', components: ['又', '欠', '辶', '卬'], hint: 'welcome' },
            { word: '分享', components: ['八', '刀', '亠', '口', '子'], hint: 'share' },
            { word: '播放', components: ['扌', '方', '攵'], hint: 'play' }, 
            { word: '评论', components: ['讠', '平', '讠', '仑'], hint: 'comment' },
            { word: '订阅', components: ['钅', '丁', '门', '兑'], hint: 'subscribe' },
            
            { word: '转动', components: ['车', '专', '云', '力'], hint: 'turn' },
            { word: '神奇', components: ['礻', '申', '大', '可'], hint: 'magical' },
            { word: '鬼', components: ['鬼'], hint: 'ghost' },
            { word: '适应', components: ['辶', '舌', '广', '兴'], hint: 'adapt' },
            { word: '代替', components: ['亻', '弋', '夫', '夫', '曰'], hint: 'replace' },
            { word: '接送', components: ['扌', '妾', '辶', '关'], hint: 'pick up/drop off' },
            { word: '发明', components: ['弓', '殳', '日', '月'], hint: 'invention' },
            { word: '改变', components: ['己', '攵', '亦', '又'], hint: 'change' },
            { word: '城市', components: ['土', '成', '亠', '巾'], hint: 'city' },
            { word: '环境', components: ['王', '不', '土', '竟'], hint: 'environment' },
            { word: '缓解', components: ['纟', '爰', '角', '刀', '牛'], hint: 'relieve' },
            { word: '道路', components: ['辶', '首', '足', '各'], hint: 'road' },
            { word: '拥堵', components: ['扌', '用', '土', '者'], hint: 'congestion' },
            { word: '现象', components: ['王', '见', '⺈', '象'], hint: 'phenomenon' },
            { word: '大幅度', components: ['大', '巾', '畐', '广', '廿', '又'], hint: 'significantly' }, 
            { word: '降低', components: ['阝', '夅', '亻', '氐'], hint: 'reduce' },

            { word: '报名', components: ['扌', '卩', '又', '夕', '口'], hint: 'sign up' },
            { word: '体验', components: ['亻', '本', '马', '佥'], hint: 'experience' },
            { word: '乘坐', components: ['禾', '北', '人', '人', '土'], hint: 'take (a ride)' },
            { word: '全球', components: ['人', '王', '王', '求'], hint: 'global' },
            { word: '首次', components: ['首', '冫', '欠'], hint: 'first time' },
            { word: '人数', components: ['人', '米', '女', '攵'], hint: 'number of people' },
            { word: '增加', components: ['土', '曾', '力', '口'], hint: 'increase' },
            { word: '一倍', components: ['一', '亻', '立', '口'], hint: 'double' },
            { word: '达到', components: ['辶', '大', '至', '刂'], hint: 'reach' },
            { word: '本次', components: ['木', '一', '冫', '欠'], hint: 'this time' },
            { word: '测试', components: ['氵', '则', '讠', '式'], hint: 'test' },
            { word: '乘客', components: ['禾', '北', '宀', '各'], hint: 'passenger' },
            { word: '紧张', components: ['纟', '臣', '又', '弓', '长'], hint: 'nervous' },
            { word: '方向盘', components: ['方', '向', '舟', '皿'], hint: 'steering wheel' }
        ];

        let currentIndex = 0;
        let isCombined = false;

        // 渲染当前单词的部件
        function renderWord() {
            const currentItem = vocabData[currentIndex];
            const compContainer = document.getElementById('components-display');
            const gameArea = document.getElementById('game-area');
            
            // 重置状态
            gameArea.classList.remove('combined');
            isCombined = false;
            document.getElementById('combine-btn').innerText = "🧩 Combine";
            
            // 清空并渲染新部件
            compContainer.innerHTML = '';
            
            // 打乱部件顺序，增加挑战性
            let shuffledComponents = [...currentItem.components].sort(() => Math.random() - 0.5);
            
            shuffledComponents.forEach(comp => {
                const card = document.createElement('div');
                card.className = 'component-card';
                card.innerText = comp;
                compContainer.appendChild(card);
            });
            
            // 预加载答案文本
            document.getElementById('answer-word').innerText = currentItem.word;
            document.getElementById('answer-hint').innerText = currentItem.hint;
            
            // 更新进度与按钮状态
            document.getElementById('progress-text').innerText = `Word ${currentIndex + 1} / ${vocabData.length}`;
            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            document.getElementById('next-btn').disabled = (currentIndex === vocabData.length - 1);
        }

        // 触发组合动画
        function combineComponents() {
            const gameArea = document.getElementById('game-area');
            const combineBtn = document.getElementById('combine-btn');
            
            if (!isCombined) {
                gameArea.classList.add('combined');
                combineBtn.innerText = "🔄 Reset";
                isCombined = true;
            } else {
                gameArea.classList.remove('combined');
                combineBtn.innerText = "🧩 Combine";
                isCombined = false;
            }
        }

        // 切换上下一个词
        function changeWord(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= vocabData.length) currentIndex = vocabData.length - 1;
            renderWord();
        }

        // 页面初始化
        window.onload = renderWord;
    </script>

</body>
</html>
