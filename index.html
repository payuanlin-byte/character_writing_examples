<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fading Writer - 完整词库版</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f8fafc;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            align-items: center;
            margin-bottom: 30px;
        }
        .progress {
            font-size: 1.1rem;
            font-weight: bold;
            color: #64748b;
            background: white;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* 游戏主体容器 */
        .game-area {
            width: 100%;
            max-width: 800px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .hint-section {
            text-align: center;
            margin-bottom: 40px;
        }
        .hint-en {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e53e3e;
            margin-bottom: 5px;
        }
        .hint-py {
            font-size: 1.2rem;
            color: #718096;
            letter-spacing: 2px;
        }

        /* 米字格与提示展示区 */
        .word-display {
            display: flex;
            gap: 25px;
            margin-bottom: 40px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .char-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 外部悬浮提示部件 */
        .side-hint {
            font-family: "Kaiti SC", "Kaiti", "STKaiti", "楷体", serif;
            font-size: 3.5rem;
            color: #3b82f6;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            min-width: 50px;
            text-align: center;
            user-select: none;
        }
        .side-hint.show {
            opacity: 1;
        }

        /* 米字格 SVG 背景绘制 */
        .mizige {
            width: 160px;
            height: 160px;
            border: 2px solid #ef4444;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><line x1='0' y1='80' x2='160' y2='80' stroke='%23ef4444' stroke-width='1.5' stroke-dasharray='6,4'/><line x1='80' y1='0' x2='80' y2='160' stroke='%23ef4444' stroke-width='1.5' stroke-dasharray='6,4'/><line x1='0' y1='0' x2='160' y2='160' stroke='%23ef4444' stroke-width='1' stroke-dasharray='3,4'/><line x1='160' y1='0' x2='0' y2='160' stroke='%23ef4444' stroke-width='1' stroke-dasharray='3,4'/></svg>");
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: white;
        }

        /* 汉字叠加技术 */
        .char-layer {
            position: absolute;
            font-family: "Kaiti SC", "Kaiti", "STKaiti", "楷体", serif;
            font-size: 130px;
            line-height: 160px;
            text-align: center;
            width: 100%;
            height: 100%;
            user-select: none;
            top: 0;
            left: 0;
        }

        /* 表层：黑色的保留部件。通过 clip-path 裁剪掉不需要的部分 */
        .layer-given {
            color: #1e293b;
            z-index: 2;
            transition: clip-path 0.4s ease;
        }
        /* 点击 Show Full Word 时，取消裁剪，展示全黑汉字 */
        .layer-given.show-full {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%) !important;
        }

        /* 底部操作按钮 */
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-nav { background-color: #64748b; color: white; }
        .btn-nav:hover { background-color: #475569; }
        .btn-nav:disabled { background-color: #cbd5e0; cursor: not-allowed; box-shadow: none; }
        
        .btn-action { background-color: #3b82f6; color: white; }
        .btn-action:hover { background-color: #2563eb; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-success:hover { background-color: #059669; }
    </style>
</head>

        let currentIndex = 0;
        let isPartsRevealed = false;
        let isWordRevealed = false;

        function renderWord() {
            const currentItem = vocabData[currentIndex];
            
            isPartsRevealed = false;
            isWordRevealed = false;
            document.getElementById('toggle-parts-btn').innerText = "🔍 Reveal Parts";
            document.getElementById('toggle-word-btn').innerText = "✨ Show Full Word";
            
            document.getElementById('hint-en').innerText = currentItem.english;
            document.getElementById('hint-py').innerText = currentItem.pinyin;
            
            const displayArea = document.getElementById('word-display');
            displayArea.innerHTML = '';
            
            currentItem.chars.forEach((charObj, index) => {
                const charGroup = document.createElement('div');
                charGroup.className = 'char-group';

                const sideHint = document.createElement('div');
                sideHint.className = 'side-hint';
                sideHint.innerText = charObj.missingText;

                const mizige = document.createElement('div');
                mizige.className = 'mizige';
                
                const layerGiven = document.createElement('div');
                layerGiven.className = 'char-layer layer-given';
                layerGiven.innerText = charObj.text;
                layerGiven.style.clipPath = charObj.clip;
                
                mizige.appendChild(layerGiven);

                // 核心排版：根据字符在词语中的前半部分还是后半部分决定提示位置
                if (index < currentItem.chars.length / 2) {
                    // 左侧字符，提示悬浮在左侧
                    charGroup.appendChild(sideHint);
                    charGroup.appendChild(mizige);
                } else {
                    // 右侧字符，提示悬浮在右侧
                    charGroup.appendChild(mizige);
                    charGroup.appendChild(sideHint);
                }

                displayArea.appendChild(charGroup);
            });

            document.getElementById('progress-text').innerText = `Word ${currentIndex + 1} / ${vocabData.length}`;
            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            document.getElementById('next-btn').disabled = (currentIndex === vocabData.length - 1);
        }

        function toggleMissingParts() {
            isPartsRevealed = !isPartsRevealed;
            const hints = document.querySelectorAll('.side-hint');
            const btn = document.getElementById('toggle-parts-btn');
            
            hints.forEach(hint => {
                if (isPartsRevealed) {
                    hint.classList.add('show');
                } else {
                    hint.classList.remove('show');
                }
            });

            btn.innerText = isPartsRevealed ? "🙈 Hide Parts" : "🔍 Reveal Parts";
            
            if (isPartsRevealed && isWordRevealed) {
                toggleFullWord(); 
            }
        }

        function toggleFullWord() {
            isWordRevealed = !isWordRevealed;
            const givenLayers = document.querySelectorAll('.layer-given');
            const btn = document.getElementById('toggle-word-btn');
            
            givenLayers.forEach(layer => {
                if (isWordRevealed) {
                    layer.classList.add('show-full');
                } else {
                    layer.classList.remove('show-full');
                }
            });

            btn.innerText = isWordRevealed ? "🙈 Hide Full Word" : "✨ Show Full Word";
            
            if (isWordRevealed && isPartsRevealed) {
                toggleMissingParts();
            }
        }

        function changeWord(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= vocabData.length) currentIndex = vocabData.length - 1;
            renderWord();
        }

        window.onload = renderWord;
    </script>

</body>
</html>
