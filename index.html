<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fading Writer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f8fafc;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 700px;
            align-items: center;
            margin-bottom: 30px;
        }
        .progress {
            font-size: 1.1rem;
            font-weight: bold;
            color: #64748b;
            background: white;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* 游戏主体容器 */
        .game-area {
            width: 100%;
            max-width: 700px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .hint-section {
            text-align: center;
            margin-bottom: 40px;
        }
        .hint-en {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e53e3e;
            margin-bottom: 5px;
        }
        .hint-py {
            font-size: 1.2rem;
            color: #718096;
            letter-spacing: 2px;
        }

        /* 汉字结构展示区 */
        .word-display {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
        }

        .char-container {
            display: flex;
            border: 3px dashed #cbd5e0;
            border-radius: 12px;
            padding: 10px;
            background: #f1f5f9;
        }

        /* 左右结构 */
        .layout-lr {
            flex-direction: row;
            align-items: center;
        }
        /* 上下结构 */
        .layout-tb {
            flex-direction: column;
            align-items: center;
        }

        .part-box {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Kaiti SC", "Kaiti", "STKaiti", "楷体", serif;
            font-size: 4rem;
            width: 80px;
            height: 80px;
            margin: 5px;
        }

        .part-given {
            color: #1976d2;
            font-weight: bold;
        }

        .part-missing {
            background: #fff;
            border: 2px solid #94a3b8;
            border-radius: 8px;
            color: transparent; /* 默认隐藏填空部分 */
            transition: all 0.3s ease;
            position: relative;
        }

        .part-missing::after {
            content: '?';
            position: absolute;
            color: #cbd5e0;
            font-family: sans-serif;
            font-size: 2rem;
        }

        /* 揭晓状态 */
        .char-container.revealed .part-missing {
            color: #e53e3e; /* 揭晓后显示红色 */
            border-color: #e53e3e;
            background: #fff5f5;
        }
        .char-container.revealed .part-missing::after {
            display: none;
        }

        /* 完整汉字展示 */
        .full-word-display {
            font-family: "Kaiti SC", "Kaiti", "STKaiti", "楷体", serif;
            font-size: 3rem;
            color: #2d3748;
            letter-spacing: 15px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            margin-top: 20px;
            height: 50px;
        }
        .full-word-display.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 底部操作按钮 */
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-nav {
            background-color: #64748b;
            color: white;
        }
        .btn-nav:hover { background-color: #475569; }
        .btn-nav:disabled { background-color: #cbd5e0; cursor: not-allowed; box-shadow: none; }
        
        .btn-action {
            background-color: #3b82f6;
            color: white;
        }
        .btn-action:hover { background-color: #2563eb; }
        .btn-success {
            background-color: #10b981;
            color: white;
        }
        .btn-success:hover { background-color: #059669; }
    </style>
</head>
<body>

    <h1>📝 Fading Writer</h1>

    <div class="header-controls">
        <div class="progress" id="progress-text">Word 1 / 4</div>
    </div>

    <!-- 游戏展示区 -->
    <div class="game-area">
        <div class="hint-section">
            <div class="hint-en" id="hint-en">sign up</div>
            <div class="hint-py" id="hint-py">(bào míng)</div>
        </div>

        <div class="word-display" id="word-display">
            <!-- JS 动态生成汉字结构 -->
        </div>

        <div class="full-word-display" id="full-word-display"></div>
    </div>

    <!-- 按钮控制区 -->
    <div class="controls">
        <button class="btn btn-nav" id="prev-btn" onclick="changeWord(-1)">⬅️ Prev</button>
        <button class="btn btn-action" onclick="revealMissing()">🔍 Reveal Parts</button>
        <button class="btn btn-success" onclick="showFullWord()">✨ Show Full Word</button>
        <button class="btn btn-nav" id="next-btn" onclick="changeWord(1)">Next ➡️</button>
    </div>

    <script>
        // 数据结构：精确定义每个字的间架结构 (layout) 和保留部件 (given)
        // layout: 'lr' (左右结构), 'tb' (上下结构)
        const vocabData = [
            {
                word: "报名", pinyin: "bào míng", english: "sign up",
                chars: [
                    { full: "报", layout: "lr", given: "扌", missing: "卩又" },
                    { full: "名", layout: "tb", given: "夕", missing: "口" }
                ]
            },
            {
                word: "体验", pinyin: "tǐ yàn", english: "experience",
                chars: [
                    { full: "体", layout: "lr", given: "亻", missing: "本" },
                    { full: "验", layout: "lr", given: "马", missing: "佥" }
                ]
            },
            {
                word: "乘坐", pinyin: "chéng zuò", english: "take (a ride)",
                chars: [
                    { full: "乘", layout: "tb", given: "禾", missing: "北" }, // 提取核心框架
                    { full: "坐", layout: "tb", given: "从", missing: "土" }
                ]
            },
            {
                word: "全球", pinyin: "quán qiú", english: "global",
                chars: [
                    { full: "全", layout: "tb", given: "人", missing: "王" },
                    { full: "球", layout: "lr", given: "王", missing: "求" }
                ]
            }
        ];

        let currentIndex = 0;

        function renderWord() {
            const currentItem = vocabData[currentIndex];
            
            // 渲染提示
            document.getElementById('hint-en').innerText = currentItem.english;
            document.getElementById('hint-py').innerText = currentItem.pinyin;
            
            // 渲染结构格
            const displayArea = document.getElementById('word-display');
            displayArea.innerHTML = '';
            
            currentItem.chars.forEach(charObj => {
                const charContainer = document.createElement('div');
                charContainer.className = `char-container layout-${charObj.layout}`;
                
                const givenPart = document.createElement('div');
                givenPart.className = 'part-box part-given';
                givenPart.innerText = charObj.given;
                
                const missingPart = document.createElement('div');
                missingPart.className = 'part-box part-missing';
                missingPart.innerText = charObj.missing;
                
                // 按照不同结构组装部件
                if (charObj.layout === 'lr') {
                    charContainer.appendChild(givenPart);
                    charContainer.appendChild(missingPart);
                } else if (charObj.layout === 'tb') {
                    charContainer.appendChild(givenPart);
                    charContainer.appendChild(missingPart);
                }
                
                displayArea.appendChild(charContainer);
            });

            // 隐藏完整答案
            const fullWordEl = document.getElementById('full-word-display');
            fullWordEl.innerText = currentItem.word;
            fullWordEl.classList.remove('show');

            // 更新状态
            document.getElementById('progress-text').innerText = `Word ${currentIndex + 1} / ${vocabData.length}`;
            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            document.getElementById('next-btn').disabled = (currentIndex === vocabData.length - 1);
        }

        // 揭晓填空部分
        function revealMissing() {
            const containers = document.querySelectorAll('.char-container');
            containers.forEach(container => {
                container.classList.add('revealed');
            });
        }

        // 显示完整标准汉字（用于核对最终比例）
        function showFullWord() {
            revealMissing(); // 确保部件也被揭晓
            document.getElementById('full-word-display').classList.add('show');
        }

        // 切换词汇
        function changeWord(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= vocabData.length) currentIndex = vocabData.length - 1;
            renderWord();
        }

        // 页面初始化
        window.onload = renderWord;
    </script>

</body>
</html>
