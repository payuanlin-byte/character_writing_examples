<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fading Writer - 米字格精准裁剪版</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f8fafc;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 700px;
            align-items: center;
            margin-bottom: 30px;
        }
        .progress {
            font-size: 1.1rem;
            font-weight: bold;
            color: #64748b;
            background: white;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* 游戏主体容器 */
        .game-area {
            width: 100%;
            max-width: 700px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .hint-section {
            text-align: center;
            margin-bottom: 40px;
        }
        .hint-en {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e53e3e;
            margin-bottom: 5px;
        }
        .hint-py {
            font-size: 1.2rem;
            color: #718096;
            letter-spacing: 2px;
        }

        /* 米字格展示区 */
        .word-display {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
        }

        /* 核心：米字格 SVG 背景绘制，完美复刻截图 */
        .mizige {
            width: 160px;
            height: 160px;
            border: 2px solid #ef4444; /* 红色外框 */
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><line x1='0' y1='80' x2='160' y2='80' stroke='%23ef4444' stroke-width='1.5' stroke-dasharray='6,4'/><line x1='80' y1='0' x2='80' y2='160' stroke='%23ef4444' stroke-width='1.5' stroke-dasharray='6,4'/><line x1='0' y1='0' x2='160' y2='160' stroke='%23ef4444' stroke-width='1' stroke-dasharray='3,4'/><line x1='160' y1='0' x2='0' y2='160' stroke='%23ef4444' stroke-width='1' stroke-dasharray='3,4'/></svg>");
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: white;
        }

        /* 双层汉字叠加技术 */
        .char-layer {
            position: absolute;
            font-family: "Kaiti SC", "Kaiti", "STKaiti", "楷体", serif;
            font-size: 130px; /* 字体大小适配160px的格子 */
            line-height: 160px;
            text-align: center;
            width: 100%;
            height: 100%;
            user-select: none;
            top: 0;
            left: 0;
        }

        /* 底层：蓝色的缺失部件。初始透明度为0（完全空白） */
        .layer-revealed {
            color: #3b82f6; /* 揭晓时的蓝色 */
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }
        .layer-revealed.show {
            opacity: 1; /* 点击 Reveal 后显示 */
        }

        /* 表层：黑色的保留部件。通过 clip-path 裁剪掉不需要的部分 */
        .layer-given {
            color: #1e293b;
            z-index: 2;
            transition: clip-path 0.4s ease;
        }
        /* 点击 Show Full Word 时，取消裁剪，展示全黑汉字 */
        .layer-given.show-full {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%) !important;
        }

        /* 底部操作按钮 */
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-nav { background-color: #64748b; color: white; }
        .btn-nav:hover { background-color: #475569; }
        .btn-nav:disabled { background-color: #cbd5e0; cursor: not-allowed; box-shadow: none; }
        
        .btn-action { background-color: #3b82f6; color: white; }
        .btn-action:hover { background-color: #2563eb; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-success:hover { background-color: #059669; }
    </style>
</head>
<body>

    <h1>📝 Fading Writer</h1>

    <div class="header-controls">
        <div class="progress" id="progress-text">Word 1 / 4</div>
    </div>

    <!-- 游戏展示区 -->
    <div class="game-area">
        <div class="hint-section">
            <div class="hint-en" id="hint-en">sign up</div>
            <div class="hint-py" id="hint-py">(bào míng)</div>
        </div>

        <div class="word-display" id="word-display">
            <!-- JS 动态生成 -->
        </div>
    </div>

    <!-- 按钮控制区 -->
    <div class="controls">
        <button class="btn btn-nav" id="prev-btn" onclick="changeWord(-1)">⬅️ Prev</button>
        <button class="btn btn-action" id="toggle-parts-btn" onclick="toggleMissingParts()">🔍 Reveal Parts</button>
        <button class="btn btn-success" id="toggle-word-btn" onclick="toggleFullWord()">✨ Show Full Word</button>
        <button class="btn btn-nav" id="next-btn" onclick="changeWord(1)">Next ➡️</button>
    </div>

    <script>
        // 数据结构：利用 clip-path 百分比精确控制只显示汉字的哪一部分
        // 比如 报：polygon(0 0, 42% 0, 42% 100%, 0 100%) 代表只显示左边 42% 的区域（即"扌"）
        const vocabData = [
            {
                word: "报名", pinyin: "bào míng", english: "sign up",
                chars: [
                    { text: "报", clip: "polygon(0 0, 42% 0, 42% 100%, 0 100%)" }, // 留左
                    { text: "名", clip: "polygon(0 0, 100% 0, 100% 52%, 0 52%)" }  // 留上
                ]
            },
            {
                word: "体验", pinyin: "tǐ yàn", english: "experience",
                chars: [
                    { text: "体", clip: "polygon(0 0, 35% 0, 35% 100%, 0 100%)" }, // 留左
                    { text: "验", clip: "polygon(0 0, 43% 0, 43% 100%, 0 100%)" }  // 留左
                ]
            },
            {
                word: "乘坐", pinyin: "chéng zuò", english: "take (a ride)",
                chars: [
                    { text: "乘", clip: "polygon(0 0, 100% 0, 100% 45%, 0 45%)" }, // 留上部禾
                    { text: "坐", clip: "polygon(0 0, 100% 0, 100% 60%, 0 60%)" }  // 留上部从
                ]
            },
            {
                word: "全球", pinyin: "quán qiú", english: "global",
                chars: [
                    { text: "全", clip: "polygon(0 0, 100% 0, 100% 50%, 0 50%)" }, // 留上部人
                    { text: "球", clip: "polygon(0 0, 38% 0, 38% 100%, 0 100%)" }  // 留左部王
                ]
            }
        ];

        let currentIndex = 0;
        let isPartsRevealed = false;
        let isWordRevealed = false;

        function renderWord() {
            const currentItem = vocabData[currentIndex];
            
            // 重置状态
            isPartsRevealed = false;
            isWordRevealed = false;
            document.getElementById('toggle-parts-btn').innerText = "🔍 Reveal Parts";
            document.getElementById('toggle-word-btn').innerText = "✨ Show Full Word";
            
            // 渲染提示
            document.getElementById('hint-en').innerText = currentItem.english;
            document.getElementById('hint-py').innerText = currentItem.pinyin;
            
            // 渲染米字格和文字
            const displayArea = document.getElementById('word-display');
            displayArea.innerHTML = '';
            
            currentItem.chars.forEach(charObj => {
                const mizige = document.createElement('div');
                mizige.className = 'mizige';
                
                // 底层：蓝色完整汉字（初始透明度为0，完全空白）
                const layerRevealed = document.createElement('div');
                layerRevealed.className = 'char-layer layer-revealed';
                layerRevealed.innerText = charObj.text;
                
                // 表层：黑色完整汉字（初始被裁剪，只露出给定部分）
                const layerGiven = document.createElement('div');
                layerGiven.className = 'char-layer layer-given';
                layerGiven.innerText = charObj.text;
                layerGiven.style.clipPath = charObj.clip;
                
                mizige.appendChild(layerRevealed);
                mizige.appendChild(layerGiven);
                displayArea.appendChild(mizige);
            });

            // 更新进度
            document.getElementById('progress-text').innerText = `Word ${currentIndex + 1} / ${vocabData.length}`;
            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            document.getElementById('next-btn').disabled = (currentIndex === vocabData.length - 1);
        }

        // 切换揭晓/隐藏蓝色空白部分
        function toggleMissingParts() {
            isPartsRevealed = !isPartsRevealed;
            const revealedLayers = document.querySelectorAll('.layer-revealed');
            const btn = document.getElementById('toggle-parts-btn');
            
            revealedLayers.forEach(layer => {
                if (isPartsRevealed) {
                    layer.classList.add('show');
                } else {
                    layer.classList.remove('show');
                }
            });

            btn.innerText = isPartsRevealed ? "🙈 Hide Parts" : "🔍 Reveal Parts";
            
            // 如果揭晓了部件，需确保全字模式关闭
            if (isPartsRevealed && isWordRevealed) {
                toggleFullWord(); 
            }
        }

        // 切换揭晓/隐藏全黑汉字
        function toggleFullWord() {
            isWordRevealed = !isWordRevealed;
            const givenLayers = document.querySelectorAll('.layer-given');
            const btn = document.getElementById('toggle-word-btn');
            
            givenLayers.forEach(layer => {
                if (isWordRevealed) {
                    layer.classList.add('show-full');
                } else {
                    layer.classList.remove('show-full');
                }
            });

            btn.innerText = isWordRevealed ? "🙈 Hide Full Word" : "✨ Show Full Word";
            
            // 如果展示了全字，需确保部件模式关闭
            if (isWordRevealed && isPartsRevealed) {
                toggleMissingParts();
            }
        }

        function changeWord(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= vocabData.length) currentIndex = vocabData.length - 1;
            renderWord();
        }

        window.onload = renderWord;
    </script>

</body>
</html>
