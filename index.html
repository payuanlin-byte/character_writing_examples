<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab 8 - Fluency Prompter Test</title>
<style>
    /* ================= 全局基础样式 ================= */
    body {
        background-color: #F0F2F5;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif; 
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        margin: 0;
    }

    .app-container {
        background-color: #FFFFFF;
        max-width: 1000px;
        width: 100%;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
        border-radius: 12px;
        padding: 40px;
        box-sizing: border-box;
    }

    /* ================= Tab 8: Fluency Prompter 专属样式 ================= */
    .fluency-wrapper { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        width: 100%; 
        background-color: #2c3e50; 
        padding: 40px 20px; 
        border-radius: 12px; 
        box-sizing: border-box; 
    }
    .fluency-header-controls { 
        display: flex; 
        gap: 15px; 
        margin-bottom: 30px; 
        flex-wrap: wrap; 
        justify-content: center; 
    }
    .fluency-select { 
        padding: 10px 15px; 
        font-size: 1.1rem; 
        border-radius: 8px; 
        border: 2px solid #34495e; 
        background: #ecf0f1; 
        color: #2c3e50; 
        font-weight: bold; 
        outline: none; 
    }
    .fluency-btn { 
        padding: 10px 25px; 
        font-size: 1.1rem; 
        border: none; 
        border-radius: 8px; 
        cursor: pointer; 
        font-weight: bold; 
        transition: all 0.2s; 
        color: white; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
    }
    .btn-play { background-color: #27ae60; }
    .btn-play:hover { background-color: #2ecc71; }
    .btn-pause { background-color: #e67e22; }
    .btn-pause:hover { background-color: #d35400; }
    .btn-reset { background-color: #c0392b; }
    .btn-reset:hover { background-color: #e74c3c; }
    
    .typewriter-container { 
        width: 100%; 
        max-width: 900px; 
        height: 450px; 
        background: #1e272e; 
        border: 4px solid #7f8c8d; 
        border-radius: 12px; 
        padding: 40px; 
        box-sizing: border-box; 
        box-shadow: inset 0 0 20px rgba(0,0,0,0.5); 
        overflow-y: auto; 
        position: relative; 
    }
    .typewriter-text { 
        font-family: "Kaiti SC", "Kaiti", "STKaiti", "楷体", serif; 
        font-size: 2.2rem; 
        line-height: 2.2; 
        color: #ecf0f1; 
        white-space: pre-wrap; 
        text-align: justify; 
    }
    .cursor { 
        display: inline-block; 
        width: 4px; 
        height: 2.2rem; 
        background-color: #f1c40f; 
        vertical-align: text-bottom; 
        margin-left: 5px; 
        animation: blink 0.8s infinite; 
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>

<div class="app-container">
    <!-- ================= TAB 8: Fluency Prompter ================= -->
    <div id="tab8" style="display: block;">
        <div class="fluency-wrapper">
            <h2 style="border-bottom: none; color: #ecf0f1; font-size: 2.2rem; margin-top: 0;">⏱️ Fluency Prompter (Shadowing)</h2>
            <p style="color: #bdc3c7; font-size: 1.1em; margin-top: -10px; margin-bottom: 30px; text-align: center;">
                Please read aloud along with the Chinese characters on the screen. Pay attention to pauses and the tone of conjunctions.
            </p>

            <!-- 提词器控制区 -->
            <div class="fluency-header-controls">
                <select id="fluency-script-select" class="fluency-select" onchange="resetTypewriter()">
                    <option value="script1">Reading: Autonomous Vehicles (Text 1)</option>
                </select>

                <select id="fluency-speed-select" class="fluency-select">
                    <option value="400">Slow (Beginner: 100 chars/min)</option>
                    <option value="250" selected>Normal (Suggested: 150 chars/min)</option>
                    <option value="150">Fast (Exam Prep: 200 chars/min)</option>
                </select>

                <button class="fluency-btn btn-play" onclick="startTypewriter()">▶️ Start</button>
                <button class="fluency-btn btn-pause" onclick="pauseTypewriter()">⏸️ Pause</button>
                <button class="fluency-btn btn-reset" onclick="resetTypewriter()">🔄 Reset</button>
            </div>

            <!-- 录音控制区 -->
            <div style="display: flex; gap: 15px; margin-bottom: 25px; align-items: center; background: #34495e; padding: 15px 25px; border-radius: 8px; width: 100%; max-width: 900px; box-sizing: border-box; flex-wrap: wrap;">
                <button class="fluency-btn" id="btn-start-record" onclick="startRecording()" style="background-color: #e74c3c;">🎤 Start Recording</button>
                <button class="fluency-btn" id="btn-stop-record" onclick="stopRecording()" style="background-color: #95a5a6;" disabled>⏹️ Stop</button>
                
                <div id="audio-playback-container" style="display: none; align-items: center; gap: 15px; margin-left: auto;">
                    <audio id="audio-playback" controls style="height: 40px;"></audio>
                    <a id="audio-download" class="fluency-btn" style="background-color: #3498db; text-decoration: none; color: white; display: inline-block; padding: 10px 15px;" download="my_reading.m4a">💾 Download</a>
                </div>
            </div>

            <!-- 提词器显示区 -->
            <div class="typewriter-container">
                <div class="typewriter-text">
                    <span id="typewriter-output"></span><span class="cursor" id="typewriter-cursor"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // Tab 8: 朗读流利度 (Fluency Typewriter) & 录音逻辑
    // ==========================================
    const fluencyScripts = {
        script1: `无人驾驶汽车\n\n大家好！欢迎各位收看我的播客。\n\n前不久，我报名参加体验乘坐新加坡无人驾驶汽车，感觉真是太棒了，今天我就来和大家聊聊无人驾驶汽车。\n\n这是全球首次向乘客开放的无人驾驶汽车，报名参与体验的人数比一个月前增加了一倍，达到1000人左右。作为本次测试的乘客之一，一开始我很紧张，看着方向盘自己转动时，这种感觉太神奇了，就像有个鬼在开车一样！但很快我就适应了，车子开得很稳，一些我看不到的障碍物，车子能看到，让我觉得可以信任它。我想以后父亲老了，无人驾驶汽车可以代替我接送父亲。\n\n那么，无人驾驶汽车的发明，除了能改变人们对城市环境的体验，还有什么好处呢？首先，无人驾驶汽车有助于缓解道路拥堵的现象，还能大幅度降低乘坐出租车的费用，而且价格比坐公交车还便宜。\n\n其次，无人驾驶出租车可以通过软件根据乘客的需求优化线路。这样一来，不但能节约乘客的乘车时间，也能让更多的乘客一起乘坐，当然就省钱啦！\n\n总的来说，无人驾驶汽车会给我们的生活带来很多方便，而且还会节省时间，也更安全。你会去新加坡体验无人驾驶出租车吗？\n\n欢迎大家留言和我分享你对无人驾驶汽车的看法。`
    };

    let typewriterTimer = null;
    let typeIndex = 0;
    let isTyping = false;

    // 录音相关变量
    let mediaRecorder;
    let audioChunks = [];

    // ================= 提词器功能 =================
    function startTypewriter() {
        if (isTyping) return;
        
        const scriptKey = document.getElementById('fluency-script-select').value;
        const textToType = fluencyScripts[scriptKey];
        const speed = parseInt(document.getElementById('fluency-speed-select').value, 10);
        const outputEl = document.getElementById('typewriter-output');
        
        if (typeIndex >= textToType.length) {
            resetTypewriter();
        }

        isTyping = true;
        document.getElementById('typewriter-cursor').style.display = 'inline-block';

        typewriterTimer = setInterval(() => {
            if (typeIndex < textToType.length) {
                outputEl.textContent += textToType.charAt(typeIndex);
                typeIndex++;
                const container = document.querySelector('.typewriter-container');
                container.scrollTop = container.scrollHeight;
            } else {
                clearInterval(typewriterTimer);
                isTyping = false;
            }
        }, speed);
    }

    function pauseTypewriter() {
        clearInterval(typewriterTimer);
        isTyping = false;
    }

    function resetTypewriter() {
        clearInterval(typewriterTimer);
        isTyping = false;
        typeIndex = 0;
        document.getElementById('typewriter-output').textContent = '';
        document.getElementById('typewriter-cursor').style.display = 'inline-block';
    }

    // ================= 录音功能 =================
    async function startRecording() {
        try {
            // 请求麦克风权限
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // 自动检测浏览器支持的最佳格式，完美兼容 Safari 和 Chrome
            let options = {};
            if (MediaRecorder.isTypeSupported('audio/mp4')) {
                options = { mimeType: 'audio/mp4' }; // 苹果 Safari 首选
            } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                options = { mimeType: 'audio/webm' }; // 谷歌 Chrome 首选
            }
            
            mediaRecorder = new MediaRecorder(stream, options);
            audioChunks = [];

            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                // 使用浏览器实际录制的原生格式
                const actualMimeType = mediaRecorder.mimeType || 'audio/webm';
                const audioBlob = new Blob(audioChunks, { type: actualMimeType });
                const audioUrl = URL.createObjectURL(audioBlob);
                
                // 根据原生格式动态决定下载的后缀名
                let extension = 'webm';
                if (actualMimeType.includes('mp4') || actualMimeType.includes('m4a')) {
                    extension = 'm4a'; // 苹果设备常见的音频后缀
                } else if (actualMimeType.includes('ogg')) {
                    extension = 'ogg';
                }
                
                // 设置播放器和下载链接
                document.getElementById('audio-playback').src = audioUrl;
                document.getElementById('audio-download').href = audioUrl;
                // 让下载的文件名带上时间戳，防止多次录音文件同名覆盖
                document.getElementById('audio-download').download = `Shadowing_Record_${new Date().getTime()}.${extension}`;
                
                // 显示播放和下载区域
                document.getElementById('audio-playback-container').style.display = 'flex';
            };

            mediaRecorder.start();
            
            // 更新 UI 状态
            const startBtn = document.getElementById('btn-start-record');
            const stopBtn = document.getElementById('btn-stop-record');
            
            startBtn.disabled = true;
            startBtn.style.backgroundColor = '#7f8c8d';
            startBtn.innerText = '🔴 Recording...';
            
            stopBtn.disabled = false;
            stopBtn.style.backgroundColor = '#e67e22';
            
            document.getElementById('audio-playback-container').style.display = 'none';
            
        } catch (err) {
            alert("Microphone access denied or not available. Please check your browser permissions.");
            console.error("Audio recording error: ", err);
        }
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
            
            // 停止所有音频轨道，释放麦克风设备
            mediaRecorder.stream.getTracks().forEach(track => track.stop());

            // 恢复 UI 状态
            const startBtn = document.getElementById('btn-start-record');
            const stopBtn = document.getElementById('btn-stop-record');
            
            startBtn.disabled = false;
            startBtn.style.backgroundColor = '#e74c3c';
            startBtn.innerText = '🎤 Start Recording';
            
            stopBtn.disabled = true;
            stopBtn.style.backgroundColor = '#95a5a6';
        }
    }
</script>
</body>
</html>
